function buildDiffRecords(baseMap, currMap){
  const epics = new Set([...Object.keys(baseMap), ...Object.keys(currMap)]);
  const records = [];
  epics.forEach(epic => {
    const b = baseMap[epic] || null;
    const c = currMap[epic] || null;
    const status = (b && c) ? 'common' : (c ? 'added' : 'removed');
    const src = c || b;
    const rec = {
      epic: epic, status: status,
      title: src.title || epic,
      vs: src.vs || 'Not assigned',
      priority: src.priority,
      line: src.line,
      team: src.team,
      points: src.points,
      release: src.release,
      customer: src.customer,
      commitment: src.commitment,
      regulatory: src.regulatory
    };
    if (status === 'common'){
      rec.prev_priority = b.priority;
      rec.prev_line = b.line;
      rec.prev_team = b.team;
      rec.prev_points = b.points;
      rec.prev_release = b.release;
      rec.prev_vs = b.vs;
    }
    records.push(rec);
  });
  return records;
}

/* ---------- cell renderers (shared by both tabs) ---------- */
function movementCell(rec){
  if (rec.status === 'added') return '<span class="new-tag">new</span>';
  if (rec.status === 'removed') return '';
  const p = rec.priority, pp = rec.prev_priority;
  if (p == null || pp == null) return '';
  if (p < pp) return '<span class="arrow-up">&#9650;</span>';
  if (p > pp) return '<span class="arrow-down">&#9660;</span>';
  return '';
}

function priorityCell(rec){
  let out = rec.priority != null ? rec.priority : '<span class="muted">&mdash;</span>';
  if (rec.status === 'common' && rec.prev_priority != null && rec.priority !== rec.prev_priority){
    out += ' <span class="muted">from ' + rec.prev_priority + '</span>';
  }
  return out;
}

function crossBadge(rec){
  if (rec.status !== 'common' || rec.prev_line == null || rec.line === rec.prev_line) return '';
  const cls = rec.line === 'ATL' ? 'cross-pill-atl' : 'cross-pill-btl';
  return '<span class="cross-pill ' + cls + '">moved ' + esc(rec.line) + '</span>';
}

function swapCell(rec, field, prevField){
  const cur = rec[field];
  const curOut = cur != null ? esc(cur) : '<span class="muted">&mdash;</span>';
  if (rec.status === 'common' && rec[prevField] != null && rec[field] !== rec[prevField]){
    return curOut + ' <span class="strike">' + esc(rec[prevField]) + '</span>';
  }
  return curOut;
}

function releaseCell(rec){
  return rec.release != null ? esc(rec.release) : '<span class="muted">&mdash;</span>';
}

function customerCell(rec){
  return rec.customer != null ? esc(rec.customer) : '<span class="muted">&mdash;</span>';
}

function commitmentCell(rec){
  if (rec.commitment == null) return '<span class="muted">&mdash;</span>';
  const cls = rec.commitment === 'Contractual' ? 'badge-contractual' :
              rec.commitment === 'Soft' ? 'badge-soft' : 'badge-commit-no';
  return '<span class="badge ' + cls + '">' + esc(rec.commitment) + '</span>';
}

function regulatoryCell(rec){
  if (rec.regulatory == null) return '<span class="muted">&mdash;</span>';
  const cls = rec.regulatory === 'Yes' ? 'badge-reg-yes' : 'badge-reg-no';
  return '<span class="badge ' + cls + '">' + esc(rec.regulatory) + '</span>';
}

const JIRA_BASE = 'https://healthedge.atlassian.net/browse/';

function rowHTML(rec){
  const rowCls = rec.status === 'removed' ? 'data-row removed-row' : 'data-row';
  const titleStyle = rec.status === 'removed' ? 'text-decoration:line-through;' : '';
  return '<tr class="' + rowCls + '">' +
    '<td class="mv-cell">' + movementCell(rec) + '</td>' +
    '<td>' + priorityCell(rec) + '</td>' +
    '<td class="title-cell">' +
      '<a class="epic-id" href="' + JIRA_BASE + esc(rec.epic) + '" target="_blank" rel="noopener">' + esc(rec.epic) + '</a>' +
      crossBadge(rec) +
      '<span class="item-title" style="' + titleStyle + '">' + esc(rec.title) + '</span>' +
    '</td>' +
    '<td>' + swapCell(rec, 'team', 'prev_team') + '</td>' +
    '<td>' + swapCell(rec, 'points', 'prev_points') + '</td>' +
    '<td>' + releaseCell(rec) + '</td>' +
    '<td>' + customerCell(rec) + '</td>' +
    '<td>' + commitmentCell(rec) + '</td>' +
    '<td>' + regulatoryCell(rec) + '</td>' +
  '</tr>';
}

function sortByPriority(arr){
  return arr.slice().sort((a,b) => {
    const ap = a.priority == null ? Infinity : a.priority;
    const bp = b.priority == null ? Infinity : b.priority;
    return ap - bp;
  });
}

function sumPoints(arr){
  return arr.reduce((s,r) => s + (r.points || 0), 0);
}

function tableHTML(rows){
  return '<table><thead><tr><th></th><th>priority</th><th>item</th><th>team</th><th>points</th><th>release</th><th>customer</th><th>commitment</th><th>regulatory</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}

function boxHTML(kind, label, arrow, list){
  const active = list.filter(r => r.status !== 'removed');
  let rows = '';
  list.forEach(r => rows += rowHTML(r));
  rows += '<tr class="subtotal-row"><td colspan="4"></td><td>' + sumPoints(active) + ' pts</td><td colspan="4"></td></tr>';
  return '<div class="line-box ' + kind + '">' +
    '<div class="line-box-head">' + arrow + ' ' + label + ' (' + active.length + ')</div>' +
    tableHTML(rows) +
  '</div>';
}

function buildSection(items){
  const atl = sortByPriority(items.filter(r => r.line === 'ATL'));
  const btl = sortByPriority(items.filter(r => r.line === 'BTL'));
  const unclassified = items.filter(r => r.line == null);

  const atlActive = atl.filter(r => r.status !== 'removed');
  const btlActive = btl.filter(r => r.status !== 'removed');
  const atlPts = sumPoints(atlActive);
  const btlPts = sumPoints(btlActive);

  let out = '<div class="cards">' +
    '<div class="card above"><div><div class="card-label">&#8593; Above the line</div><div class="card-sub">' + atlActive.length + ' epics</div></div>' +
      '<div><div class="card-value">' + atlPts + '</div><div class="card-unit">story points</div></div></div>' +
    '<div class="card below"><div><div class="card-label">&#8595; Below the line</div><div class="card-sub">' + btlActive.length + ' epics</div></div>' +
      '<div><div class="card-value">' + btlPts + '</div><div class="card-unit">story points</div></div></div>' +
  '</div>';

  out += boxHTML('above', 'above the line', '&#8593;', atl);
  out += boxHTML('below', 'below the line', '&#8595;', btl);

  if (unclassified.length){
    let rows = '';
    unclassified.forEach(r => rows += rowHTML(r));
    out += '<div class="line-box"><div class="line-box-head" style="background:#f3f4f6;color:#6b7280;">not yet classified (' + unclassified.filter(r=>r.status!=='removed').length + ')</div>' + tableHTML(rows) + '</div>';
  }

  return out;
}

/* ---------- reusable per-tab view: VS dropdown + team chips + sections ---------- */
function createPlanView(ids, getRecords){
  let allRecords = [];
  let currentVsItems = [];
  const excludedTeams = new Set();

  const vsSelectEl = document.getElementById(ids.vsSelect);
  const teamFiltersEl = document.getElementById(ids.teamFilters);
  const sectionsEl = document.getElementById(ids.sections);

  function teamsForItems(items){
    const teams = new Set();
    items.forEach(r => { if (r.team) teams.add(r.team); });
    return Array.from(teams).sort((a,b) => a.localeCompare(b));
  }

  function renderTeamFilters(){
    const teams = teamsForItems(currentVsItems);
    teamFiltersEl.innerHTML = teams.map(t => {
      const checked = !excludedTeams.has(t);
      return '<label class="team-chip' + (checked ? '' : ' unchecked') + '"><input type="checkbox" ' + (checked ? 'checked' : '') + ' data-team="' + esc(t) + '"> ' + esc(t) + '</label>';
    }).join('') +
    '<a href="#" class="team-link" data-action="all">all</a>' +
    '<a href="#" class="team-link" data-action="none">none</a>';

    teamFiltersEl.querySelectorAll('.team-chip').forEach(chip => {
      const cb = chip.querySelector('input');
      cb.addEventListener('change', () => {
        const team = cb.getAttribute('data-team');
        if (cb.checked) excludedTeams.delete(team); else excludedTeams.add(team);
        chip.classList.toggle('unchecked', !cb.checked);
        renderTable();
      });
    });
    teamFiltersEl.querySelectorAll('.team-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const action = link.getAttribute('data-action');
        teams.forEach(t => { if (action === 'all') excludedTeams.delete(t); else excludedTeams.add(t); });
        renderTeamFilters();
        renderTable();
      });
    });
  }

  function renderTable(){
    const filtered = currentVsItems.filter(r => r.team == null || !excludedTeams.has(r.team));
    sectionsEl.innerHTML = buildSection(filtered);
  }

  function onVsChange(){
    const byVs = {};
    allRecords.forEach(r => { (byVs[r.vs] = byVs[r.vs] || []).push(r); });
    currentVsItems = byVs[vsSelectEl.value] || [];
    renderTeamFilters();
    renderTable();
  }

  function refresh(preserveVs){
    allRecords = getRecords();
    const vsList = Array.from(new Set(allRecords.map(r => r.vs))).sort((a,b) => a.localeCompare(b));
    const prevVal = vsSelectEl.value;
    vsSelectEl.innerHTML = vsList.map(vs => '<option value="' + esc(vs) + '">' + esc(vs) + '</option>').join('');
    if (preserveVs && vsList.includes(prevVal)) vsSelectEl.value = prevVal;
    onVsChange();
  }

  vsSelectEl.addEventListener('change', onVsChange);
  return { refresh: refresh };
}

/* ---------- Tab 1: fixed 9/11 -> 9/17 ---------- */

}
